plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs'
    id 'kotlin-kapt'
}
android {
    signingConfigs {
        debug {
            storeFile file('F:\\project\\Enforcement\\test.jks')
            storePassword '123456'
            keyAlias 'key0'
            keyPassword '123456'
        }
    }
    namespace 'com.ysh.demo'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId namespace
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation":
                                     "$projectDir/schemas".toString()]
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding true
    }
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            def createTime = new Date().format("YYYY-MM-dd_HH-mm-ss", TimeZone.getTimeZone("GMT+08:00"))
            def fileName = "blank_${buildType.name}_v${defaultConfig.versionName}_${createTime}.apk"
            outputFileName = fileName
        }
    }
}
dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation project(path: ':autosize')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    //权限管理
    implementation 'com.github.getActivity:XXPermissions:20.0'
    implementation 'com.blankj:utilcodex:1.31.1'

    def okhttp = "4.10.0"
    implementation "com.squareup.okhttp3:okhttp:${okhttp}"
    implementation("com.squareup.okhttp3:logging-interceptor:${okhttp}") {
        exclude group: 'com.squareup.okhttp3'
        exclude group: 'org.jetbrains.kotlin'
    }

    implementation("com.squareup.retrofit2:converter-scalars:2.9.0") {
        exclude group: 'com.squareup.retrofit2'
    }
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'

    implementation 'io.github.razerdp:BasePopup:3.2.0'

    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation('com.github.chrisbanes:PhotoView:2.0.0') {
        exclude group: 'com.android.support'
    }

    implementation 'com.github.liangjingkanji:BRV:1.3.83'

    //mvvm
    implementation 'com.github.hegaojian:JetpackMvvm:1.2.7'

    //minio
    implementation 'com.amazonaws:aws-android-sdk-s3:2.78.0'


//    implementation 'androidx.navigation:navigation-fragment-ktx:2.5.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.5.2'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    //腾讯mmkv
    implementation 'com.tencent:mmkv-static:1.2.11'

    //图片选择
    implementation 'io.github.lucksiege:pictureselector:v3.11.2'
    implementation 'io.github.lucksiege:compress:v3.11.1'

    implementation 'com.github.SherlockGougou:BigImageViewPager:androidx-8.2.1'

    def room_version = "2.3.0"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    //mqtt 消息
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation('org.greenrobot:eventbus:3.3.1')
    //lottie 动画
    implementation 'com.airbnb.android:lottie:6.6.7'
}

